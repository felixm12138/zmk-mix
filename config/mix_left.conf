# Left half (peripheral): nice_view_gem display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_VIEW_GEM_PERIPHERAL_CENTRAL_RELAY=y

# Stop the 100 Hz display refresh while the left half is idle (ZMK_IDLE_TIMEOUT).
# nice!view has no blanking support, so it keeps showing the last frame;
# refresh resumes on the next left-half key press or encoder turn.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
