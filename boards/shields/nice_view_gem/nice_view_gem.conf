CONFIG_ZMK_DISPLAY=y
# Stop the 100 Hz display refresh while idle (ZMK_IDLE_TIMEOUT) to save power.
# ls0xx has no blanking support, so the nice!view keeps showing the last frame;
# refresh resumes on the next input on this half.
# Set here (not in config/mix_left.conf): shield .conf files are merged after
# the user config, so a user-config value would be overridden.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y